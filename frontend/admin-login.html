<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procurement Centre Login — Mandisathi</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">
          <img src="img/logo.png" alt="Mandisathi Logo" class="brand-icon-img" onerror="this.onerror=null; this.src='img/brand-logo.png';">
        </span>
        <span class="brand-title" data-i18n="brandTitle">Mandisathi</span>
      </a>
      <div class="header-actions">
        <button id="langSwitchBtn" class="lang-btn">हिंदी</button>
        <span class="badge badge-blue" style="font-size: 0.8rem; padding: 0.35rem 0.75rem;">🏛️ Procurement Centre Portal</span>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-card-container" style="border-top: 4px solid var(--secondary);">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <img src="img/logo.png" alt="Mandisathi - Procurement Portal" class="auth-logo-badge" onerror="this.onerror=null; this.src='img/brand-logo.png';">
        <h1 style="font-size: 1.4rem; font-weight: 700;" data-i18n="adminLoginTitle">Procurement Centre & Admin Login</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem;" data-i18n="adminLoginSubtitle">Authorized Centre Officers and State Mandi Board Administrators</p>
      </div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label" for="adminMobile" data-i18n="officerMobileLabel">Officer Mobile / Admin ID</label>
          <input type="tel" id="adminMobile" class="form-input" placeholder="e.g. 9893011111 or 9999999999" required maxlength="10">
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPassword" data-i18n="passwordInputLabel">Security Password</label>
          <input type="password" id="adminPassword" class="form-input" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-secondary btn-block" style="margin-top: 0.5rem;" data-i18n="adminLoginBtn">
          Secure Officer Login →
        </button>
      </form>

      <!-- 1-Click Evaluation Buttons -->
      <div class="quick-demo-box">
        <div style="font-weight: 700; margin-bottom: 0.5rem; color: #1e40af;" data-i18n="adminDemoTitle">
          ⚡ Quick Demo Login (Role-Specific):
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <button id="fillOfficerDemoBtn" type="button" class="btn btn-sm btn-secondary btn-block" style="justify-content: flex-start; text-align: left;">
            👮‍♂️ <strong>Centre Officer:</strong> Sanwer Mandi (9893011111 / officer123)
          </button>
          <button id="fillAdminDemoBtn" type="button" class="btn btn-sm btn-secondary btn-block" style="justify-content: flex-start; text-align: left;">
            🏛️ <strong>Govt Admin:</strong> State Mandi Board (9999999999 / admin123)
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div><strong data-i18n="brandTitle">Mandisathi</strong> • <span data-i18n="footerText">Department of Food & Civil Supplies</span></div>
  </footer>

  <script src="js/socket.io.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
