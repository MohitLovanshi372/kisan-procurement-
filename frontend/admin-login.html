<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procurement Centre Login — Mandisathi</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">
          <img src="img/logo.png" alt="Mandisathi Logo" class="brand-icon-img" onerror="this.onerror=null; this.src='img/brand-logo.png';">
        </span>
        <span class="brand-title" data-i18n="brandTitle">Mandisathi</span>
      </a>
      <div class="header-actions">
        <button id="langSwitchBtn" class="lang-btn">हिंदी</button>
        <span class="badge badge-blue" style="font-size: 0.8rem; padding: 0.35rem 0.75rem;">🏛️ Procurement Centre Portal</span>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-card-container" style="border-top: 4px solid var(--secondary);">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <img src="img/logo.png" alt="Mandisathi - Procurement Portal" class="auth-logo-badge" onerror="this.onerror=null; this.src='img/brand-logo.png';">
        <h1 style="font-size: 1.4rem; font-weight: 700;" data-i18n="adminLoginTitle">Procurement Centre & Admin Login</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem;" data-i18n="adminLoginSubtitle">Authorized Centre Officers and State Mandi Board Administrators</p>
      </div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label" for="adminMobile">Officer ID / Mobile Number / Admin ID</label>
          <input type="text" id="adminMobile" class="form-input" placeholder="e.g. OFF001 or 9893011111 or 9999999999" required maxlength="25">
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPassword">Security Password (पासवर्ड)</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="adminPassword" class="form-input" placeholder="Enter security password" required style="padding-right: 2.75rem;">
            <button type="button" id="toggleAdminPasswordBtn" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; font-size: 1.15rem; padding: 0.25rem; color: #64748b;" title="Show/Hide Password" aria-label="Toggle Password Visibility">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" id="adminSubmitBtn" class="btn btn-secondary btn-block" style="margin-top: 0.5rem; font-weight: 700;">
          Secure Staff & Officer Login →
        </button>
      </form>

      <!-- 1-Click Fast Login Evaluation Buttons -->
      <div class="quick-demo-box" style="margin-top: 1.25rem; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 0.9rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem;">
          <span style="font-weight: 800; color: #1e40af; font-size: 0.84rem;">
            ⚡ Quick 1-Click Login:
          </span>
          <span class="badge badge-green" style="font-size: 0.7rem; padding: 0.2rem 0.5rem;">Fast &lt;100ms</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <div style="display: flex; gap: 0.4rem;">
            <button id="directAdminOfficerLoginBtn" type="button" class="btn btn-sm btn-block" style="background: #0284c7; color: #ffffff; border: none; font-size: 0.82rem; font-weight: 700; border-radius: 8px; justify-content: flex-start; text-align: left; padding: 0.5rem 0.75rem; display: flex; align-items: center; justify-content: space-between;">
              <span>🏛️ <strong>Sanwer Mandi Officer:</strong> Rajesh Sharma</span>
              <span style="background: rgba(255,255,255,0.25); padding: 0.15rem 0.45rem; border-radius: 4px; font-size: 0.74rem;">⚡ Instant Login</span>
            </button>
            <button id="fillOfficerDemoBtn" type="button" class="btn btn-sm btn-secondary" title="Fill credentials only" style="padding: 0.5rem 0.6rem; font-size: 0.8rem; border-radius: 8px;">
              ✏️
            </button>
          </div>
          <div style="display: flex; gap: 0.4rem;">
            <button id="directAdminGovtLoginBtn" type="button" class="btn btn-sm btn-block" style="background: #4f46e5; color: #ffffff; border: none; font-size: 0.82rem; font-weight: 700; border-radius: 8px; justify-content: flex-start; text-align: left; padding: 0.5rem 0.75rem; display: flex; align-items: center; justify-content: space-between;">
              <span>🛡️ <strong>Govt Admin (Full Control):</strong> Mandi Board</span>
              <span style="background: rgba(255,255,255,0.25); padding: 0.15rem 0.45rem; border-radius: 4px; font-size: 0.74rem;">⚡ Instant Login</span>
            </button>
            <button id="fillAdminDemoBtn" type="button" class="btn btn-sm btn-secondary" title="Fill credentials only" style="padding: 0.5rem 0.6rem; font-size: 0.8rem; border-radius: 8px;">
              ✏️
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div><strong data-i18n="brandTitle">Mandisathi</strong> • <span data-i18n="footerText">Department of Food & Civil Supplies</span></div>
  </footer>

  <script src="js/socket.io.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
