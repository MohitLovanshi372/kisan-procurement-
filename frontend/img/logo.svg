<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e7339" />
      <stop offset="70%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#0a3219" />
    </radialGradient>

    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="wheatGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="sunGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#fde047" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base outer circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#goldRing)" stroke-width="8" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldRing)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.85" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldRing)" stroke-width="3" />

  <!-- Inner central emblem disc -->
  <circle cx="256" cy="256" r="176" fill="#0d4022" stroke="url(#goldRing)" stroke-width="4" />

  <!-- Rising Sun rays behind wheat in inner disc -->
  <g opacity="0.35">
    <line x1="256" y1="256" x2="256" y2="90" stroke="#fde047" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="256" x2="210" y2="95" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
    <line x1="256" y1="256" x2="302" y2="95" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
    <line x1="256" y1="256" x2="168" y2="115" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
    <line x1="256" y1="256" x2="344" y2="115" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
    <line x1="256" y1="256" x2="132" y2="152" stroke="#fde047" stroke-width="2" stroke-linecap="round" />
    <line x1="256" y1="256" x2="380" y2="152" stroke="#fde047" stroke-width="2" stroke-linecap="round" />
    <line x1="256" y1="256" x2="110" y2="200" stroke="#fde047" stroke-width="2" stroke-linecap="round" />
    <line x1="256" y1="256" x2="402" y2="200" stroke="#fde047" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Half sun disc -->
  <path d="M 196 280 A 60 60 0 0 1 316 280 Z" fill="url(#sunGlow)" opacity="0.75" />

  <!-- Symmetrical Wheat Ears (Left & Right) -->
  <!-- Center Stem -->
  <path d="M 256 360 L 256 140" stroke="url(#goldRing)" stroke-width="5" stroke-linecap="round" />

  <!-- Center wheat grains -->
  <g fill="url(#wheatGold)" stroke="#92400e" stroke-width="1.2">
    <!-- Top tip grain -->
    <ellipse cx="256" cy="132" rx="9" ry="17" />
    
    <!-- Grain pairs along stem -->
    <ellipse cx="244" cy="154" rx="10" ry="19" transform="rotate(-28 244 154)" />
    <ellipse cx="268" cy="154" rx="10" ry="19" transform="rotate(28 268 154)" />

    <ellipse cx="240" cy="180" rx="11" ry="21" transform="rotate(-30 240 180)" />
    <ellipse cx="272" cy="180" rx="11" ry="21" transform="rotate(30 272 180)" />

    <ellipse cx="238" cy="208" rx="12" ry="23" transform="rotate(-32 238 208)" />
    <ellipse cx="274" cy="208" rx="12" ry="23" transform="rotate(32 274 208)" />

    <ellipse cx="236" cy="238" rx="12.5" ry="23" transform="rotate(-34 236 238)" />
    <ellipse cx="276" cy="238" rx="12.5" ry="23" transform="rotate(34 276 238)" />

    <ellipse cx="236" cy="268" rx="12.5" ry="23" transform="rotate(-34 236 268)" />
    <ellipse cx="276" cy="268" rx="12.5" ry="23" transform="rotate(34 276 268)" />

    <ellipse cx="238" cy="298" rx="12" ry="22" transform="rotate(-32 238 298)" />
    <ellipse cx="274" cy="298" rx="12" ry="22" transform="rotate(32 274 298)" />

    <ellipse cx="242" cy="326" rx="11" ry="20" transform="rotate(-28 242 326)" />
    <ellipse cx="270" cy="326" rx="11" ry="20" transform="rotate(28 270 326)" />
  </g>

  <!-- Wheat awns / whiskers -->
  <g stroke="url(#goldRing)" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="120" x2="256" y2="85" />
    <line x1="240" y1="145" x2="215" y2="105" />
    <line x1="272" y1="145" x2="297" y2="105" />
    <line x1="234" y1="172" x2="198" y2="135" />
    <line x1="278" y1="172" x2="314" y2="135" />
    <line x1="230" y1="200" x2="186" y2="168" />
    <line x1="282" y1="200" x2="326" y2="168" />
    <line x1="228" y1="230" x2="180" y2="202" />
    <line x1="284" y1="230" x2="332" y2="202" />
  </g>

  <!-- Left curving wheat stalk wreath -->
  <g fill="url(#wheatGold)" stroke="#78350f" stroke-width="1.2">
    <ellipse cx="140" cy="230" rx="9" ry="18" transform="rotate(-55 140 230)" />
    <ellipse cx="132" cy="265" rx="9" ry="18" transform="rotate(-40 132 265)" />
    <ellipse cx="136" cy="302" rx="9" ry="18" transform="rotate(-20 136 302)" />
    <ellipse cx="150" cy="336" rx="9" ry="18" transform="rotate(5 150 336)" />
    <ellipse cx="174" cy="365" rx="9" ry="18" transform="rotate(30 174 365)" />
    <ellipse cx="206" cy="385" rx="9" ry="18" transform="rotate(50 206 385)" />
  </g>
  <!-- Left wreath stem -->
  <path d="M 148 195 C 120 250, 130 340, 225 400" fill="none" stroke="url(#goldRing)" stroke-width="4" stroke-linecap="round" />

  <!-- Right curving wheat stalk wreath -->
  <g fill="url(#wheatGold)" stroke="#78350f" stroke-width="1.2">
    <ellipse cx="372" cy="230" rx="9" ry="18" transform="rotate(55 372 230)" />
    <ellipse cx="380" cy="265" rx="9" ry="18" transform="rotate(40 380 265)" />
    <ellipse cx="376" cy="302" rx="9" ry="18" transform="rotate(20 376 302)" />
    <ellipse cx="362" cy="336" rx="9" ry="18" transform="rotate(-5 362 336)" />
    <ellipse cx="338" cy="365" rx="9" ry="18" transform="rotate(-30 338 365)" />
    <ellipse cx="306" cy="385" rx="9" ry="18" transform="rotate(-50 306 385)" />
  </g>
  <!-- Right wreath stem -->
  <path d="M 364 195 C 392 250, 382 340, 287 400" fill="none" stroke="url(#goldRing)" stroke-width="4" stroke-linecap="round" />

  <!-- Lower Ribbon / Plaque for MSP -->
  <path d="M 180 400 L 332 400 L 320 432 L 256 426 L 192 432 Z" fill="#b45309" stroke="url(#goldRing)" stroke-width="2" filter="url(#shadow)" />
  <path d="M 188 406 L 324 406 L 314 426 L 256 422 L 198 426 Z" fill="url(#goldRing)" />
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#14532d" text-anchor="middle" letter-spacing="3">MSP DIRECT</text>

  <!-- Circular Arch Text: MANDISATHI & मंदीसाथी -->
  <path id="textArchTop" d="M 80 256 A 176 176 0 0 1 432 256" fill="none" />
  <text fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="6">
    <textPath href="#textArchTop" startOffset="50%" text-anchor="middle">
      ★ MANDISATHI ★
    </textPath>
  </text>

  <!-- Circular Arch Text Bottom: DEPARTMENT OF FOOD & CIVIL SUPPLIES -->
  <path id="textArchBottom" d="M 425 268 A 172 172 0 0 1 87 268" fill="none" />
  <text fill="url(#goldRing)" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="2.5">
    <textPath href="#textArchBottom" startOffset="50%" text-anchor="middle">
      GOVT. PROCUREMENT PORTAL
    </textPath>
  </text>
</svg>